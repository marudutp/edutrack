<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduTrack.pro - App Engine</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="../js/license-manager.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #007bff;
            --success: #28a745;
            --warning: #ffc107;
            --danger: #dc3545;
            --info: #17a2b8;
            --light: #f0f2f5;
            --dark: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            text-align: center;
            background: var(--light);
            margin: 0;
            padding: 20px;
        }

        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
        }

        #tirai-pembayaran {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(15px);
            z-index: 99999;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .tirai-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
            max-width: 400px;
            width: 90%;
        }

        .container {
            max-width: 900px;
            margin: auto;
            display: none;
        }

        .id-card {
            width: 320px;
            height: 500px;
            background: white;
            border-radius: 20px;
            border: 1px solid #ccc;
            margin: 20px auto;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            display: none;
        }

        .btn-group-card {
            display: none;
            margin-top: 20px;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-action {
            border: none;
            padding: 12px 18px;
            border-radius: 10px;
            color: white;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
        }

        .search-card {
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            text-align: left;
            margin-bottom: 30px;
        }

        .table-container {
            max-height: 500px;
            overflow-y: auto;
            background: white;
            border-radius: 15px;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            background: #f8fafc;
            padding: 15px;
            position: sticky;
            top: 0;
            border-bottom: 2px solid #eee;
            font-size: 13px;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #eee;
            text-align: left;
            font-size: 14px;
        }

        .input-style {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        .btn-sync {
            background: #64748b;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
        }

        #reader {
            width: 100%;
            border-radius: 15px;
            overflow: hidden;
            display: none;
            margin-top: 15px;
            border: 2px solid var(--primary);
        }

        /* Badge Pertemuan */
        .badge-meeting {
            background: #e0f2fe;
            color: #0369a1;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 11px;
            display: inline-block;
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <div id="loading-screen">Menghubungkan ke Cloud Engine...</div>

    <div id="tirai-pembayaran">
        <div class="tirai-content">
            <h2>Akses Terkunci, Lur! 🙏</h2>
            <p id="pesan-tirai"></p>
            <input type="text" id="input-token" class="input-style" placeholder="Masukkan Token Aktivasi...">
            <button onclick="prosesAktivasi()"
                style="width:100%; background:var(--primary); color:white; border:none; padding:12px; border-radius:5px; cursor:pointer;">Aktifkan
                Sekarang</button>
        </div>
    </div>

    <div class="container" id="main-app">
        <!-- <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
            <button class="btn-sync" onclick="syncDataLama()"><i class="fas fa-sync"></i> Sync Data Lama</button>
            <span
                style="font-size: 10px; font-weight: bold; background: #e0f2fe; color: #0369a1; padding: 4px 10px; border-radius: 12px;"><i
                    class="fas fa-cloud"></i> PRO CLOUD ACTIVE</span>
        </div> -->

        <img id="ui-logo" src=""
            style="width:90px; height:90px; display:none; margin: 0 auto 10px auto; border-radius: 50%; object-fit: cover; border: 3px solid white;">
        <h1 id="ui-school-name" style="margin: 0;">Memuat Sekolah...</h1>

        <div class="search-card" style="margin-top: 20px;">
            <h3><i class="fas fa-id-card"></i> ID Card Generator</h3>
            <input type="text" id="inputNama" placeholder="Nama Lengkap Siswa..." class="input-style">
            
            <input type="text" id="inputJoinDate" placeholder="Join Date Siswa" 
                onfocus="(this.type='date')" onblur="if(!this.value)this.type='text'" class="input-style">
            
            <button onclick="generateIDCard()"
                style="width:100%; padding: 15px; background:var(--primary); color:white; border:none; border-radius:8px; font-weight:bold; cursor:pointer;">BUAT
                KARTU</button>
        </div>

        <div id="id-card-result">
            <div id="printableCard" class="id-card">
                <div id="card-header" style="background:var(--primary); color:white; padding:25px; font-weight:bold;">
                    <img id="card-logo" src=""
                        style="width:65px; height:65px; border-radius:50%; border:3px solid white; background:white; object-fit: cover;"><br>
                    <div id="card-school-name" style="margin-top:10px; font-size: 18px;"></div>
                </div>
                <div style="padding:25px; background: white;">
                    <div id="qrcode" style="display:flex; justify-content:center; margin:20px 0;"></div>
                    <div id="displayNama" style="font-size:24px; font-weight:bold; color: var(--dark);"></div>
                    <div style="color:#64748b; margin-top: 5px;">Joined: <span id="displayJoinDate"></span></div>
                </div>
            </div>

            <div id="card-actions" class="btn-group-card">
                <button class="btn-action" style="background:var(--info);" onclick="shareWA()"><i
                        class="fab fa-whatsapp"></i> Share</button>
                <button class="btn-action" style="background:var(--warning); color:#333;" onclick="printCard()"><i
                        class="fas fa-print"></i> Cetak</button>
                <button class="btn-action" style="background:var(--success);" onclick="downloadCard()"><i
                        class="fas fa-image"></i> PNG</button>
            </div>
        </div>

        <hr style="margin:40px 0; border:1px dashed #ccc;">

        <h3><i class="fas fa-camera"></i> Scanner & Jurnal Cloud</h3>

        <div style="display: flex; gap: 10px;">
            <button id="start-btn" onclick="startScanner()"
                style="flex: 2; background:var(--success); color:white; border:none; padding:15px; border-radius:10px; font-weight:bold; cursor:pointer;">
                <i class="fas fa-camera"></i> MULAI SCAN
            </button>
            <button id="gallery-btn" onclick="document.getElementById('qr-input-file').click()"
                style="flex: 1; background:var(--info); color:white; border:none; padding:15px; border-radius:10px; font-weight:bold; cursor:pointer;">
                <i class="fas fa-image"></i> GALERI
            </button>
            <button id="stop-btn" onclick="stopScanner()"
                style="flex: 1; background:var(--danger); color:white; border:none; padding:15px; border-radius:10px; font-weight:bold; cursor:pointer; display:none;">
                <i class="fas fa-times"></i> TUTUP
            </button>
        </div>

        <input type="file" id="qr-input-file" accept="image/*" style="display:none">
        <div id="reader"></div>

        <div style="margin-top: 20px;">
            <input type="text" id="search-jurnal" onkeyup="filterJurnal()"
                placeholder="🔍 Cari Nama Siswa di Riwayat..." class="input-style">
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <button onclick="openPrintDialog()" 
                style="flex: 1; background:var(--info); color:white; border:none; padding:12px; border-radius:10px; font-weight:bold; cursor:pointer;">
                <i class="fas fa-file-pdf"></i> CETAK LAPORAN
            </button>
        </div>

        <div id="print-dialog" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; align-items: center; justify-content: center;">
            <div style="background: white; padding: 30px; border-radius: 15px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); max-width: 400px; width: 90%;">
                <h3 style="margin-top: 0;">Pilih Jenis Laporan</h3>
                <div style="margin-bottom: 20px;">
                    <label style="display: flex; gap: 10px; margin-bottom: 10px; cursor: pointer;">
                        <input type="radio" name="print-type" value="all" checked> <span>Laporan Semua Siswa (ALL)</span>
                    </label>
                    <label style="display: flex; gap: 10px; cursor: pointer;">
                        <input type="radio" name="print-type" value="single"> <span>Laporan Per Siswa</span>
                    </label>
                </div>

                <div id="student-select-container" style="display: none; margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold;">Pilih Nama Siswa:</label>
                    <select id="student-dropdown" class="input-style">
                        <option value="">-- Pilih Siswa --</option>
                    </select>
                </div>

                <div style="display: flex; gap: 10px;">
                    <button onclick="closePrintDialog()" 
                        style="flex: 1; background: #ccc; color: #333; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">Batal</button>
                    <button onclick="generateReport()" 
                        style="flex: 1; background: var(--success); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold;">Cetak</button>
                </div>
            </div>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>Nama Siswa</th>
                        <th style="width: 100px;">Pertemuan</th>
                        <th style="width: 110px;">Waktu</th>
                        <th>Catatan Jurnal</th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        let html5QrCode;
        let schoolUUID = null;
        let lastScannedData = null;
        let lastScannedTime = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            await initApp();
            if (window.schoolData) {
                const s = window.schoolData;
                schoolUUID = s.id;
                document.getElementById('ui-school-name').innerText = s.name;
                document.getElementById('card-school-name').innerText = s.name;
                if (s.logo_url) {
                    const logoPath = `../${s.logo_url}`;
                    document.getElementById('ui-logo').src = logoPath;
                    document.getElementById('ui-logo').style.display = 'block';
                    document.getElementById('card-logo').src = logoPath;
                }
                if (s.theme_color) document.documentElement.style.setProperty('--primary', s.theme_color);
                renderTable();
            }
        });

        // PROSES SCAN (Anti Double-Scan)
        function processQrResult(text) {
            const now = Date.now();
            if (text === lastScannedData && (now - lastScannedTime) < 5000) {
                console.log("Data sama, abaikan lur...");
                return;
            }
            lastScannedData = text;
            lastScannedTime = now;
            saveDataCloud(text);
        }

        // KONTROL SCANNER
        async function stopScanner() {
            if (html5QrCode) {
                try { await html5QrCode.stop(); } catch (e) {}
                document.getElementById('reader').style.display = 'none';
                document.getElementById('start-btn').style.display = 'block';
                document.getElementById('gallery-btn').style.display = 'block';
                document.getElementById('stop-btn').style.display = 'none';
            }
        }

        async function startScanner() {
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('gallery-btn').style.display = 'none';
            document.getElementById('stop-btn').style.display = 'block';
            document.getElementById('reader').style.display = 'block';
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start({ facingMode: "environment" }, { fps: 15, qrbox: 250 }, (text) => {
                processQrResult(text);
            }).catch(err => {
                alert("Kamera Error, Lur!");
                stopScanner();
            });
        }

        // SCAN DARI GALERI
        document.getElementById('qr-input-file').addEventListener('change', e => {
            if (e.target.files.length === 0) return;
            const imageFile = e.target.files[0];
            if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
            html5QrCode.scanFile(imageFile, true)
                .then(text => { processQrResult(text); alert("Berhasil baca dari galeri, Lur!"); })
                .catch(err => { alert("QR Code gak kebaca, Lur!"); });
        });

        // FILTER PENCARIAN
        function filterJurnal() {
            const input = document.getElementById('search-jurnal').value.toLowerCase();
            const rows = document.querySelectorAll('#historyBody tr');
            rows.forEach(row => {
                const studentName = row.cells[0].innerText.toLowerCase();
                row.style.display = studentName.includes(input) ? '' : 'none';
            });
        }

        // TAMPILKAN TABEL JURNAL (Mendukung kolom Pertemuan & Textarea)
        async function renderTable() {
            if (!schoolUUID) return;
            const { data: logs, error } = await _supabase.from('attendance_logs').select('*')
                .eq('school_id', schoolUUID).order('created_at', { ascending: false });

            if (!error) {
                document.getElementById('historyBody').innerHTML = logs.map(i => {
                    const currentNote = i.note || '';
                    const remaining = 150 - currentNote.length;
                    return `
                <tr>
                    <td style="vertical-align: top;"><strong>${i.student_info}</strong></td>
                    <td style="vertical-align: top;"><span class="badge-meeting">Ke-${i.meeting_number || '1'}</span></td>
                    <td style="vertical-align: top; font-size:11px; color:#666;">${new Date(i.created_at).toLocaleString('id-ID')}</td>
                    <td>
                        <div style="display:flex; flex-direction:column; gap:5px; min-width: 220px;">
                            <textarea id="note-${i.id}" maxlength="150" oninput="updateCharCount(${i.id}, this)"
                                style="width: 100%; border:1px solid #ddd; padding:8px; border-radius:8px; resize: none; font-family: inherit; font-size: 13px; box-sizing: border-box;"
                                rows="3" placeholder="Tulis jurnal...">${currentNote}</textarea>
                            <div style="display:flex; justify-content: space-between; align-items: center;">
                                <small style="color: #888; font-size: 10px;">Sisa: <span id="count-${i.id}">${remaining}</span></small>
                                <button onclick="saveNoteCloud(${i.id})" 
                                    style="background:var(--success); color:white; border:none; padding:4px 10px; border-radius:6px; cursor:pointer; font-size: 11px; font-weight: bold;">
                                    <i class="fas fa-save"></i> SIMPAN
                                </button>
                            </div>
                        </div>
                    </td>
                </tr>`}).join('');
            }
        }

        // HITUNG KARAKTER JURNAL
        function updateCharCount(id, el) {
            const remaining = 150 - el.value.length;
            const counterEl = document.getElementById(`count-${id}`);
            if (counterEl) {
                counterEl.innerText = remaining;
                counterEl.style.color = remaining <= 10 ? "red" : "#888";
            }
        }

        // SIMPAN KE CLOUD (Trigger di Supabase sudah menangani meeting_number)
        async function saveDataCloud(val) {
            const { error } = await _supabase.from('attendance_logs').insert([{ 
                school_id: schoolUUID, 
                student_info: val 
            }]);
            
            if (!error) { renderTable(); beep(); }
            else { console.error("Cloud Save Error:", error); }
        }

        // SIMPAN NOTES JURNAL
        async function saveNoteCloud(logId) {
            const noteVal = document.getElementById(`note-${logId}`).value;
            const { error } = await _supabase.from('attendance_logs').update({ note: noteVal }).eq('id', logId);
            if (!error) alert("Notes Jurnal Tersimpan!");
        }

        // KARTU ID GENERATOR
        function generateIDCard() {
            const nama = document.getElementById('inputNama').value.trim();
            const join = document.getElementById('inputJoinDate').value;
            if (!nama || !join) return alert("Data belum lengkap!");
            document.getElementById('displayNama').innerText = nama;
            document.getElementById('displayJoinDate').innerText = join;
            document.getElementById('printableCard').style.display = 'block';
            document.getElementById('card-actions').style.display = 'flex';
            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), { text: `${clientId}-${nama}`, width: 160, height: 160 });
        }

        // DOWNLOAD PNG
        function downloadCard() {
            const card = document.getElementById("printableCard");
            html2canvas(card, { scale: 3, useCORS: true }).then(canvas => {
                const link = document.createElement("a");
                link.download = `ID-${document.getElementById('displayNama').innerText}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        // CETAK KARTU
        function printCard() {
            const card = document.getElementById("printableCard");
            html2canvas(card, { scale: 2, useCORS: true }).then(canvas => {
                const imgData = canvas.toDataURL("image/png");
                const win = window.open('', '_blank');
                win.document.write(`<html><body onload="window.print(); window.close();"><img src="${imgData}" style="width:320px;"/></body></html>`);
                win.document.close();
            });
        }

        // SHARE WHATSAPP
        async function shareWA() {
            const nama = document.getElementById('displayNama').innerText;
            const card = document.getElementById("printableCard");
            try {
                const canvas = await html2canvas(card, { scale: 2, useCORS: true });
                const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                const file = new File([blob], `ID-${nama}.png`, { type: 'image/png' });
                if (navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({ files: [file], title: `ID Card`, text: `Halo ${nama}, ini kartu EduTrack kamu.` });
                } else {
                    window.open(`https://wa.me/?text=${encodeURIComponent('Halo ' + nama + ', ini kartu EduTrack kamu.')}`, '_blank');
                }
            } catch (e) { alert("Gagal share."); }
        }

        // SYNC DATA LAMA (Local Storage)
        async function syncDataLama() {
            let keyDinamis = `logs_${clientId}`;
            let localLogs = JSON.parse(localStorage.getItem(keyDinamis)) || [];
            if (localLogs.length === 0) return alert(`Nggak ada data lama.`);
            const cloudReady = localLogs.map(l => ({ school_id: schoolUUID, student_info: l.info, note: l.note || '', created_at: l.ts }));
            const { error } = await _supabase.from('attendance_logs').insert(cloudReady);
            if (!error) { alert("Sinkronisasi Berhasil!"); renderTable(); localStorage.removeItem(keyDinamis); }
        }

        // BEEP SOUND
        function beep() {
            const ctx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = ctx.createOscillator(); const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = 880; gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.1);
            osc.start(); osc.stop(ctx.currentTime + 0.1);
        }

        // ===== FUNGSI CETAK LAPORAN =====

        // Buka Dialog Cetak Laporan
        async function openPrintDialog() {
            document.getElementById('print-dialog').style.display = 'flex';
            
            // Populate student dropdown
            const students = await getUniqueStudents();
            const dropdown = document.getElementById('student-dropdown');
            dropdown.innerHTML = '<option value="">-- Pilih Siswa --</option>';
            students.forEach(student => {
                const option = document.createElement('option');
                option.value = student;
                option.textContent = student;
                dropdown.appendChild(option);
            });

            // Setup radio button listeners
            const radios = document.querySelectorAll('input[name="print-type"]');
            radios.forEach(radio => {
                radio.onchange = () => {
                    const container = document.getElementById('student-select-container');
                    if (radio.value === 'single') {
                        container.style.display = 'block';
                    } else {
                        container.style.display = 'none';
                    }
                };
            });
        }

        // Tutup Dialog Cetak Laporan
        function closePrintDialog() {
            document.getElementById('print-dialog').style.display = 'none';
        }

        // Ambil Daftar Siswa Unik
        async function getUniqueStudents() {
            if (!schoolUUID) return [];
            const { data: logs, error } = await _supabase.from('attendance_logs').select('student_info')
                .eq('school_id', schoolUUID);
            
            if (error) return [];
            
            const uniqueStudents = [...new Set(logs.map(log => log.student_info))].sort();
            return uniqueStudents;
        }

        // Generate Laporan
        async function generateReport() {
            const printType = document.querySelector('input[name="print-type"]:checked').value;
            const selectedStudent = document.getElementById('student-dropdown').value;

            if (printType === 'single' && !selectedStudent) {
                alert('Silakan pilih siswa terlebih dahulu!');
                return;
            }

            if (!schoolUUID) return;

            const { data: logs, error } = await _supabase.from('attendance_logs').select('*')
                .eq('school_id', schoolUUID).order('created_at', { ascending: true });

            if (error) {
                alert('Gagal mengambil data laporan!');
                return;
            }

            // Filter data berdasarkan tipe laporan
            let filteredLogs = logs;
            if (printType === 'single') {
                filteredLogs = logs.filter(log => log.student_info === selectedStudent);
            }

            // Group dan sort data
            const groupedData = groupLogsByStudent(filteredLogs);

            // Generate HTML laporan
            const reportHTML = generateReportHTML(groupedData, printType);

            // Buka di tab baru dan cetak
            const printWindow = window.open('', '_blank');
            printWindow.document.write(reportHTML);
            printWindow.document.close();

            // Auto print setelah halaman load
            printWindow.onload = () => {
                setTimeout(() => {
                    printWindow.print();
                }, 500);
            };

            closePrintDialog();
        }

        // Group Logs by Student
        function groupLogsByStudent(logs) {
            const grouped = {};
            
            logs.forEach(log => {
                if (!grouped[log.student_info]) {
                    grouped[log.student_info] = [];
                }
                grouped[log.student_info].push(log);
            });

            // Sort setiap student's data berdasarkan tanggal
            Object.keys(grouped).forEach(student => {
                grouped[student].sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
            });

            return grouped;
        }

        // Generate Report HTML
        function generateReportHTML(groupedData, printType) {
            const schoolName = document.getElementById('ui-school-name').innerText;
            const timestamp = new Date().toLocaleString('id-ID');
            
            let tableHTML = '';

            Object.keys(groupedData).sort().forEach(studentName => {
                const logs = groupedData[studentName];
                
                tableHTML += `
                    <div style="page-break-after: always; margin-bottom: 40px;">
                        <h2 style="margin: 0 0 10px 0; font-size: 18px; border-bottom: 2px solid #333; padding-bottom: 5px;">
                            ${studentName}
                        </h2>
                        <table style="width: 100%; border-collapse: collapse; margin-top: 15px;">
                            <thead>
                                <tr style="background-color: #f0f0f0; border-bottom: 2px solid #333;">
                                    <th style="padding: 12px; text-align: left; border: 1px solid #ddd;">Tanggal</th>
                                    <th style="padding: 12px; text-align: center; border: 1px solid #ddd;">Pertemuan Ke-</th>
                                    <th style="padding: 12px; text-align: left; border: 1px solid #ddd;">Catatan Jurnal</th>
                                </tr>
                            </thead>
                            <tbody>
                `;

                logs.forEach((log, index) => {
                    const date = new Date(log.created_at).toLocaleString('id-ID', {
                        year: 'numeric',
                        month: '2-digit',
                        day: '2-digit',
                        hour: '2-digit',
                        minute: '2-digit'
                    });
                    const note = log.note || '-';
                    const meetingNum = log.meeting_number || (index + 1);

                    tableHTML += `
                        <tr style="border-bottom: 1px solid #ddd;">
                            <td style="padding: 10px; border: 1px solid #ddd; font-size: 13px;">${date}</td>
                            <td style="padding: 10px; border: 1px solid #ddd; text-align: center; font-weight: bold;">${meetingNum}</td>
                            <td style="padding: 10px; border: 1px solid #ddd; font-size: 13px;">${note}</td>
                        </tr>
                    `;
                });

                tableHTML += `
                            </tbody>
                        </table>
                    </div>
                `;
            });

            const html = `
                <!DOCTYPE html>
                <html lang="id">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0">
                    <title>Laporan Jurnal - ${schoolName}</title>
                    <style>
                        body {
                            font-family: Arial, sans-serif;
                            margin: 20px;
                            color: #333;
                        }
                        .header {
                            text-align: center;
                            margin-bottom: 30px;
                            border-bottom: 3px solid #333;
                            padding-bottom: 15px;
                        }
                        .header h1 {
                            margin: 0;
                            font-size: 24px;
                        }
                        .header p {
                            margin: 5px 0;
                            font-size: 12px;
                            color: #666;
                        }
                        .report-info {
                            margin-bottom: 20px;
                            font-size: 12px;
                            color: #666;
                        }
                        table {
                            width: 100%;
                            border-collapse: collapse;
                        }
                        th, td {
                            padding: 12px;
                            text-align: left;
                        }
                        th {
                            background-color: #f0f0f0;
                            font-weight: bold;
                            border: 1px solid #ddd;
                        }
                        td {
                            border: 1px solid #ddd;
                        }
                        @media print {
                            body {
                                margin: 0;
                                padding: 0;
                            }
                            .no-print {
                                display: none;
                            }
                        }
                    </style>
                </head>
                <body>
                    <div class="header">
                        <h1>${schoolName}</h1>
                        <p>Laporan Jurnal Kehadiran Siswa</p>
                    </div>
                    
                    <div class="report-info">
                        <p><strong>Jenis Laporan:</strong> ${printType === 'all' ? 'Semua Siswa' : 'Per Siswa'}</p>
                        <p><strong>Tanggal Cetak:</strong> ${timestamp}</p>
                    </div>

                    ${tableHTML}

                    <div style="margin-top: 50px; text-align: right; font-size: 12px; color: #666;">
                        <p>Dicetak pada: ${timestamp}</p>
                    </div>
                </body>
                </html>
            `;

            return html;
        }
    </script>
</body>

</html>
